<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="theme-color" content="#EDE9E4" />
  <link rel="icon" href="/img/logo-mark.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/img/logo-horizontal.png" alt="Good Cup Coffee Co." />
    </div>

    {{EYEBROW}}
    <h1 class="name">{{FULL_NAME}}</h1>
    {{ROLES}}
    {{ORG}}
    {{FEATURED}}

    <ul class="links">
      {{LINKS}}
    </ul>

    <a class="save" href="/vcard">Save contact</a>

    {{FOOTER}}
  </main>
</body>
</html>
