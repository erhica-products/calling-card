:root {
  /* Primary palette */
  --gc-crema:   #EDE9E4;
  --gc-cashew:  #D1C8C1;
  --gc-robusta: #46362B;

  /* Semantic */
  --bg:         var(--gc-cashew);   /* warm stone ground */
  --surface:    var(--gc-crema);    /* the card itself is cream */
  --surface-alt: #E4DFD8;           /* Crema, a shade down — icon wells */
  --fg:         var(--gc-robusta);
  --fg-muted:   #6B5A4D;
  --border:     #C9BFB5;   /* reads against Crema, not white */
  --divider:    rgba(70, 54, 43, 0.10);

  /* One accent per artifact — Dulce Coral */
  --accent:     #F28778;

  --font-sans: "Good Sans", "DM Sans", ui-sans-serif, -apple-system,
               BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

  --tracking-eyebrow: 0.18em;
  --shadow-md: 0 6px 18px rgba(70, 54, 43, 0.10);
  --shadow-lg: 0 18px 40px rgba(70, 54, 43, 0.14);
  --ease-standard: cubic-bezier(.22,.61,.36,1);
  --dur-medium: 240ms;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}

/* ── The card ─────────────────────────────────────────────────────────── */
.card {
  width: 100%;
  max-width: 460px;
  container-type: inline-size;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;              /* cards: 14–22px, never pill */
  box-shadow: var(--shadow-md);
  padding: 40px 32px 32px;
}

/* Logo — treated with clearspace, never crowded */
.brand { margin-bottom: 56px; }
.brand img { display: block; height: 48px; width: auto; }

/* Eyebrow — all-caps, wide tracking, the single coral moment */
/* The single accent: a 24px coral hairline above the location label. */
.eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 20px;
}
.eyebrow::before {
  content: "";
  display: block;
  width: 24px;
  height: 1.5px;
  background: var(--accent);
  margin-bottom: 20px;
}

.name {
  font-size: clamp(22px, 7.6vw, 38px);   /* fallback: no container queries */
  font-size: 10.3cqw;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  white-space: nowrap;
  margin-bottom: 20px;
}

.roles { margin-bottom: 14px; }
.role {
  font-size: 13.5px;
  font-weight: 400;
  color: var(--fg-muted);
  line-height: 1.45;
  letter-spacing: 0.005em;
}

.org { font-size: 15px; }
.org a {
  color: var(--fg);
  font-weight: 500;
  text-decoration: none;
  border-bottom: 1.5px solid transparent;
  transition: border-color var(--dur-medium) var(--ease-standard);
}
.org a:hover { border-bottom-color: var(--accent); }

.featured { margin-top: 24px; font-size: 15px; }
.featured a {
  color: var(--fg);
  text-decoration: none;
  border-bottom: 1.5px solid var(--accent);
  padding-bottom: 2px;
}

/* ── Contact icons ────────────────────────────────────────────────────── */
.links {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 40px 0;
  padding-top: 36px;
  border-top: 1px solid var(--divider);
}
.links a {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 1px solid rgba(70, 54, 43, 0.14);
  border-radius: 999px;
  color: var(--fg);
  background: transparent;
  transition: background var(--dur-medium) var(--ease-standard),
              border-color var(--dur-medium) var(--ease-standard);
}
/* Pastels hover to their sibling — the one accent moment on the card. */
.links a:hover {
  background: var(--accent);
  border-color: var(--accent);
}
.links a:active { transform: scale(0.98); }

/* Divides her own links from Good Cup's. */
.links .sep {
  width: 1px;
  height: 24px;
  align-self: center;
  background: rgba(70, 54, 43, 0.16);
  margin: 0 6px;
}

/* ── Save contact — pill, primary CTA ─────────────────────────────────── */
.save {
  display: block;
  text-align: center;
  padding: 17px 24px;
  background: var(--fg);
  color: var(--gc-crema);
  border-radius: 999px;
  text-decoration: none;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  transition: background var(--dur-medium) var(--ease-standard),
              box-shadow var(--dur-medium) var(--ease-standard);
}
.save:hover { background: #3A2C23; box-shadow: var(--shadow-lg); }
.save:active { transform: scale(0.98); }

.foot {
  margin-top: 40px;
  padding-top: 28px;
  border-top: 1px solid var(--divider);
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-subtle, #8C7D71);
}

/* Focus — visible, respectful */
a:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 2px;
  border-radius: 2px;
}

@media (max-width: 380px) {
  .card { padding: 32px 24px 24px; border-radius: 14px; }
  .brand { margin-bottom: 56px; }
}

</style>
</head>
<body>
